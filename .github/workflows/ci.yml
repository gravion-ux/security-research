name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install the development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Validate the advisory documents
        run: python scripts/validate_advisories.py
      - name: Run the validator's test suite
        run: python -m pytest . -q
